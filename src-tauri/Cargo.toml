[package]
name        = "ompx"
version     = "0.1.0"
description = "OMPX — local OMP session browser and embedded terminal"
authors     = ["Smruti Ranjan Rana <heyitsranjan>"]
edition     = "2021"
license     = "MIT"
repository  = "https://github.com/ranjan-hackerrank/ompx"
publish     = false

[lib]
name       = "ompx_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# ── Tauri core + plugins ──────────────────────────────────────────────────
tauri               = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-log       = "2"
tauri-plugin-dialog    = "2"

# ── Serialisation ─────────────────────────────────────────────────────────
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"


# ── File-system watching ──────────────────────────────────────────────────
notify = "6"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

# ── Cross-platform PTY (WezTerm project) ─────────────────────────────────
portable-pty = "0.8"

# ── Structured logging ────────────────────────────────────────────────────
tracing            = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
log                = "0.4"          # log facade used by tauri-plugin-log

# ── Utilities ─────────────────────────────────────────────────────────────
dirs        = "5"
anyhow      = "1"
base64      = "0.22"
parking_lot = "0.12"
uuid        = { version = "1", features = ["v4"] }
chrono      = { version = "0.4", features = ["serde"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = "symbols"
