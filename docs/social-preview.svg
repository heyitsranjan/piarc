<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
  <title id="title">PiArc — local session control for Oh My Pi</title>
  <desc id="desc">A dark macOS-style developer workspace with a local session sidebar and terminal pane.</desc>
  <defs>
    <linearGradient id="canvas" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090a0c"/>
      <stop offset="1" stop-color="#12161c"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#d7ff64" stop-opacity=".20"/>
      <stop offset="1" stop-color="#d7ff64" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#000" flood-opacity=".45"/>
    </filter>
    <style>
      .mono { font-family: Menlo, Monaco, "SFMono-Regular", Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    </style>
  </defs>

  <rect width="1280" height="640" fill="url(#canvas)"/>
  <circle cx="1120" cy="-35" r="470" fill="url(#glow)"/>
  <path d="M0 520 C250 430 360 680 630 530 S1050 415 1280 525 V640 H0Z" fill="#0a0d11" opacity=".8"/>

  <g transform="translate(74 88)">
    <rect width="82" height="82" rx="18" fill="#090a0c" stroke="#2c343d" stroke-width="2"/>
    <g fill="#d7ff64">
      <rect x="18" y="20" width="46" height="10"/>
      <rect x="23" y="30" width="10" height="29"/>
      <rect x="43" y="30" width="10" height="42"/>
    </g>
  </g>
  <text x="178" y="124" class="sans" font-size="62" font-weight="760" fill="#f4f7f7" letter-spacing="-2">PiArc</text>
  <text x="181" y="164" class="mono" font-size="17" fill="#aeb8c1" letter-spacing="1.2">THE LOCAL COMPANION FOR OH MY PI</text>

  <g transform="translate(74 220)" filter="url(#shadow)">
    <rect width="1132" height="326" rx="16" fill="#11161c" stroke="#2a323b" stroke-width="2"/>
    <rect width="302" height="326" rx="16" fill="#0c1015"/>
    <path d="M302 0 V326" stroke="#2a323b" stroke-width="2"/>

    <circle cx="30" cy="32" r="6" fill="#ff5f57"/>
    <circle cx="50" cy="32" r="6" fill="#febc2e"/>
    <circle cx="70" cy="32" r="6" fill="#28c840"/>
    <text x="28" y="75" class="sans" font-size="15" fill="#c7d0d8" font-weight="650">RECENT SESSIONS</text>
    <rect x="24" y="93" width="254" height="1" fill="#2a323b"/>

    <g transform="translate(18 112)">
      <rect width="268" height="54" rx="9" fill="#27301c" stroke="#d7ff64" stroke-opacity=".55"/>
      <circle cx="18" cy="18" r="5" fill="#d7ff64"/>
      <text x="32" y="22" class="sans" font-size="15" fill="#f5f8f3" font-weight="650">Update OMP status</text>
      <text x="32" y="42" class="mono" font-size="11" fill="#b8c8a0">CURRENT SESSION  ·  6m ago</text>
    </g>
    <g transform="translate(18 178)">
      <circle cx="18" cy="14" r="5" fill="#6f7b87"/>
      <text x="32" y="18" class="sans" font-size="15" fill="#d7dde3">List directory contents</text>
      <text x="32" y="37" class="mono" font-size="11" fill="#7f8b96">project workspace  ·  11h ago</text>
    </g>
    <g transform="translate(18 233)">
      <circle cx="18" cy="14" r="5" fill="#6f7b87"/>
      <text x="32" y="18" class="sans" font-size="15" fill="#d7dde3">Create zip of targets and source</text>
      <text x="32" y="37" class="mono" font-size="11" fill="#7f8b96">oh-my-pi  ·  12h ago</text>
    </g>

    <text x="338" y="47" class="mono" font-size="13" fill="#87929d">~/Developer/oh-my-pi</text>
    <rect x="326" y="64" width="786" height="1" fill="#2a323b"/>
    <text x="340" y="105" class="sans" font-size="26" fill="#f1f4f5" font-weight="650">Update OMP status</text>
    <text x="340" y="135" class="sans" font-size="15" fill="#9aa8b4">Pick up exactly where your coding session stopped.</text>
    <rect x="340" y="165" width="742" height="112" rx="10" fill="#090c10" stroke="#242d36"/>
    <text x="365" y="201" class="mono" font-size="16" fill="#d7ff64">$ omp --resume 019ffe5e-3e7e-7000-a243-ccce1998a378</text>
    <text x="365" y="233" class="mono" font-size="14" fill="#8796a3">Restores your session, terminal, and working directory.</text>
    <rect x="900" y="213" width="150" height="38" rx="7" fill="#d7ff64"/>
    <text x="923" y="238" class="sans" font-size="14" fill="#11170b" font-weight="750">Resume</text>
  </g>

  <text x="76" y="605" class="sans" font-size="21" fill="#d7dde3">Browse. Resume. Stay in flow.</text>
  <text x="1204" y="605" text-anchor="end" class="mono" font-size="14" fill="#7e8b96">MACOS · LOCAL-FIRST · PRIVATE</text>
</svg>
