name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  version:
    name: Version consistency
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare package, Cargo, and Tauri versions
        shell: bash
        run: |
          set -euo pipefail
          package_version=$(node -p "require('./package.json').version")
          cargo_version=$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].version')
          tauri_version=$(jq -r '.version' src-tauri/tauri.conf.json)
          test "$package_version" = "$cargo_version"
          test "$package_version" = "$tauri_version"

  frontend:
    name: Frontend
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Validate frontend
        run: bun run validate:frontend
      - name: Build frontend
        run: bun run build
      - name: Audit production dependencies
        run: bun audit --production

  rust:
    name: Rust
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - name: Format check
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - name: Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --all-targets

  app:
    name: Unsigned app smoke build
    runs-on: macos-14
    needs: [version, frontend, rust]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri
      - run: bun install --frozen-lockfile
      - name: Build application bundle
        run: bun run tauri build --bundles app
      - name: Verify bundle metadata
        shell: bash
        run: |
          set -euo pipefail
          app="src-tauri/target/release/bundle/macos/PiArc.app"
          test -d "$app"
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleIdentifier)" = "com.heyitsranjan.piarc"
          test "$(defaults read "$PWD/$app/Contents/Info" CFBundleShortVersionString)" = "$(node -p "require('./package.json').version")"
          test "$(defaults read "$PWD/$app/Contents/Info" LSMinimumSystemVersion)" = "12.0"
