name: Release macOS

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing vX.Y.Z tag to build
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    name: Signed universal macOS release
    runs-on: macos-14
    environment: release
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify annotated signed release tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          ref_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}")
          test "$(jq -r '.object.type' <<<"$ref_json")" = "tag"
          tag_sha=$(jq -r '.object.sha' <<<"$ref_json")
          tag_json=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}")
          test "$(jq -r '.verification.verified' <<<"$tag_json")" = "true"
          test "$(jq -r '.object.type' <<<"$tag_json")" = "commit"
          commit_sha=$(jq -r '.object.sha' <<<"$tag_json")
          test "$(git rev-parse HEAD)" = "$commit_sha"
          git merge-base --is-ancestor "$commit_sha" origin/main

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: src-tauri

      - name: Require Apple release credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          test -n "$APPLE_CERTIFICATE"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_SIGNING_IDENTITY"
          test -n "$APPLE_ID"
          test -n "$APPLE_PASSWORD"
          test -n "$APPLE_TEAM_ID"

      - name: Validate tag and source versions
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          test "$RELEASE_TAG" = "v$version"
          test "$version" = "$(node -p "require('./package.json').version")"
          test "$version" = "$(cargo metadata --manifest-path src-tauri/Cargo.toml --no-deps --format-version 1 | jq -r '.packages[0].version')"
          test "$version" = "$(jq -r '.version' src-tauri/tauri.conf.json)"

      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Run release gates
        run: bun run validate

      - name: Build, sign, notarize, and draft release
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: OMPX ${{ env.RELEASE_TAG }}
          releaseBody: See CHANGELOG.md for release details and SHA256SUMS.txt for artifact digests.
          releaseDraft: true
          prerelease: false
          args: --target universal-apple-darwin --bundles app,dmg

      - name: Verify universal signed and notarized application
        shell: bash
        env:
          EXPECTED_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          EXPECTED_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          app="src-tauri/target/universal-apple-darwin/release/bundle/macos/OMPX.app"
          dmg=$(printf '%s\n' src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          test -d "$app"
          test -f "$dmg"
          test "$(lipo -archs "$app/Contents/MacOS/ompx")" = "x86_64 arm64"

          verify_app() {
            local candidate="$1"
            local info="$candidate/Contents/Info.plist"
            local entitlements="$RUNNER_TEMP/$(basename "$candidate")-entitlements.plist"
            local signature="$RUNNER_TEMP/$(basename "$candidate")-signature.txt"

            codesign --verify --deep --strict --verbose=2 "$candidate"
            codesign -d --entitlements :- "$candidate" > "$entitlements"
            codesign -dv --verbose=4 "$candidate" > "$signature" 2>&1
            grep -Fqx "TeamIdentifier=$EXPECTED_TEAM_ID" "$signature"
            grep -Fqx "Authority=$EXPECTED_SIGNING_IDENTITY" "$signature"
            test "$(/usr/libexec/PlistBuddy -c 'Print :com.apple.security.automation.apple-events' "$entitlements")" = "true"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$info")" = "com.heyitsranjan.ompx"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$info")" = "${RELEASE_TAG#v}"
            test "$(/usr/libexec/PlistBuddy -c 'Print :LSMinimumSystemVersion' "$info")" = "12.0"
            test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSAppleEventsUsageDescription' "$info")"
            test -n "$(/usr/libexec/PlistBuddy -c 'Print :NSScreenCaptureUsageDescription' "$info")"
            spctl --assess --type execute --verbose=2 "$candidate"
            xcrun stapler validate "$candidate"
          }

          verify_app "$app"
          xcrun stapler validate "$dmg"

          mount_point=$(mktemp -d)
          cleanup() {
            hdiutil detach "$mount_point" >/dev/null 2>&1 || true
            rm -rf "$mount_point"
          }
          trap cleanup EXIT
          hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_point"
          verify_app "$mount_point/OMPX.app"

      - name: Publish SHA-256 checksums
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          dmg=$(printf '%s\n' src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg)
          shasum -a 256 "$dmg" | sed 's#  .*/#  #' > SHA256SUMS.txt
          gh release upload "$RELEASE_TAG" SHA256SUMS.txt --clobber
