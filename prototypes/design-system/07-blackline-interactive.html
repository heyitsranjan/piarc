display:flex;border-bottom:1px solid var(--line);background:#0b0c0f;overflow:hidden}.terminal-tab{position:relative;min-width:175px;max-width:230px;height:32px;display:flex;align-items:center;gap:7px;border:0;border-right:1px solid var(--line);background:transparent;color:var(--dim);padding:0 10px;font:8px var(--mono)}.terminal-tab.active{background:#0a0b0e;color:var(--text)}.terminal-tab.active:before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--accent)}.terminal-tab .close{margin-left:auto;color:var(--dim)}.terminal-tab .live{color:var(--green)}.terminal-host{position:relative;min-height:0;background:#0a0b0e}.terminal-host iframe{display:block;width:100%;height:100%;border:0}.terminal-contract{position:absolute;right:10px;top:8px;z-index:2;color:#42464d;font:7px var(--mono);text-transform:uppercase;letter-spacing:.08em;pointer-events:none}.terminal-contract b{color:#697454;font-weight:400}.workspace-panel{position:absolute;z-index:4;right:0;top:0;bottom:0;width:460px;border-left:1px solid var(--line2);background:#0d0f12;box-shadow:-20px 0 48px #0008;display:none;grid-template-rows:40px 1fr}.workspace-panel.open{display:grid}.panel-head{display:flex;align-items:center;padding:0 10px;border-bottom:1px solid var(--line);font:8px var(--mono);text-transform:uppercase;letter-spacing:.08em}.panel-head b{color:var(--accent);font-weight:500}.panel-head span{margin-left:9px;color:var(--dim);text-transform:none;letter-spacing:0}.panel-head button{margin-left:auto;border:0;background:transparent;color:var(--muted)}.panel-body{min-height:0;display:grid;grid-template-columns:170px 1fr}.tree{border-right:1px solid var(--line);padding:8px 5px;overflow:auto}.tree button{display:block;width:100%;height:26px;border:0;background:transparent;border-radius:4px;color:var(--muted);padding:0 7px;text-align:left;font:8px var(--mono)}.tree button:hover,.tree button.active{background:var(--raised);color:var(--text)}.tree .indent{padding-left:18px}.tree .chang <body>

<script>
const terminalContract='omp-terminal-unchanged.html';
const sessions=[
{id:'s1',title:'Custom model settings',cwd:'~/Developer/oh-my-pi',path:'feat/custom-model-settings',time:'now',live:true,pinned:true},
{id:'s2',title:'Initial setup screen',cwd:'~/Developer/oh-my-pi',path:'feat/omp-setup',time:'18m',live:true},
{id:'s3',title:'API retry investigation',cwd:'~/Developer/platform-api',path:'main',time:'1h',live:false},
{id:'s4',title:'Review session sidebar',cwd:'~/Developer/frontend',path:'feature/session-browser',time:'16h',live:false},
{id:'s5',title:'Migration validation',cwd:'~/Developer/accounts',path:'main',time:'1d',live:false}
];
const terminals=[
{id:'t1',title:'Dev server',cwd:'~/Developer/oh-my-pi',path:'zsh',time:'12m',live:true},
{id:'t2',title:'Release build',cwd:'~/Developer/oh-my-pi',path:'cargo build',time:'34m',live:true}
];
let mode='sessions',activeId='s1',workspace=null,models=[{name:'Company Claude',provider:'Company Portkey',id:'@anthropic/claude-sonnet',protocol:'OpenAI Chat Completions / Portkey'}];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
function current(){return [...sessions,...terminals].find(x=>x.id===activeId)||sessions[0]}
function renderSidebar(){const q=$('#sideSearch').value.toLowerCase();const source=(mode==='sessions'?sessions:terminals).filter(x=>!q||`${x.title} ${x.cwd}`.toLowerCase().includes(q));const row=x=>'<div class="row '+(x.id===activeId?'active':'')+'" data-id="'+x.id+'" role="button" tabindex="0"><i class="state-dot '+(x.live?'live':'')+'"></i><span><strong>'+x.title+'</strong><small>'+(x.live?'Running · ':'')+x.cwd+'</small></span><time>'+x.time+'</time></div>';const section=(title,items)=>items.length?'<div class="group">'+title+'</div>'+items.map(row).join(''):'';if(!source.length){$('#collection').innerHTML='<div class="empty">No '+mode+' match this search.</div>'}else if(mode==='sessions'){$('#collection').innerHTML=section('Pinned',source.filter(x=>x.pinned))+section('Recent sessions',source.filter(x=>!x.pinned))}else{$('#collection').innerHTML=section('Terminals',source)}$$('.row').forEach(rowEl=>{rowEl.onclick=()=>activate(rowEl.dataset.id);rowEl.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();activate(rowEl.dataset.id)}}})}
function activate(id){const item=[...sessions,...terminals].find(x=>x.id===id);if(!item)return;activeId=id;$('#windowTitle').textContent=`${item.title} — ${item.cwd.split('/').pop()}`;$('#statusCwd').textContent=item.cwd;$('#statusBranch').textContent=`${item.path} · 4 changes`;renderSidebar();closeWorkspace();showToast(`Opened ${item.title}`)}
function setMode(next){mode=next;$$('.side-tab').forEach(b=>b.classList.toggle('active',b.dataset.mode===mode));$('#sideSearch').placeholder=`Search ${next==='sessions'?'sessions':'terminals'} · ⌘F`;renderSidebar()}
function toggleSidebar(){const hidden=$('#sidebar').style.display==='none';$('#sidebar').style.display=hidden?'flex':'none';$('#workbench').style.gridTemplateColumns=hidden?'280px 1fr':'1fr'}
function openWorkspace(next){workspace=workspace===next?null:next;$('#workspacePanel').classList.toggle('open',!!workspace);$('#filesBtn').classList.toggle('active',workspace==='files');$('#gitBtn').classList.toggle('active',workspace==='git');if(!workspace)return;const files=['src','  components','    SettingsDialog.tsx','    Sidebar.tsx','  hooks','    useTerminal.ts','src-tauri','  custom_models.rs','README.md'];const changes=['M  src/components/SettingsDialog.tsx','M  src/lib/ipc.ts','M  src-tauri/src/services/custom_models.rs','M  CHANGELOG.md'];$('#panelTitle').textContent=workspace==='files'?'Project files':'Git changes';$('#panelTree').innerHTML=(workspace==='files'?files:changes).map((x,i)=>`<button class="${i===2?'active ':''}${workspace==='git'?'changed':''}">${x}</button>`).join('');$('#panelViewer').innerHTML=workspace==='files'?`<h3>SettingsDialog.tsx</h3><pre><span class="add">+ Custom Models</span>\n  Provider routing\n  Keychain-backed API key\n  Context window\n\n<span class="muted">Select a file to inspect its contents.</span></pre>`:`<h3>SettingsDialog.tsx</h3><pre><span class="del">- const providers = builtIn;</span>\n<span class="add">+ const models = await listCustomModels();</span>\n<span class="add">+ await saveCustomModel(draft);</span>\n\n4 files changed\n58 insertions · 9 deletions</pre>`}
function closeWorkspace(){workspace=null;$('#workspacePanel').classList.remove('open');$('#filesBtn').classList.remove('active');$('#gitBtn').classList.remove('active')}
function modal(html,small=false){$('#modalDialog').className=`dialog${small?' small':''}`;$('#modalDialog').innerHTML=html;$('#modal').classList.add('open');$$('[data-close-modal]').forEach(b=>b.onclick=closeModal)}
function closeModal(){ $('#modal').classList.remove('open') }
function openCreate(){modal(`<header class="dialog-head"><div><h2>Create</h2><p>Start Arc or open a plain terminal.</p></div><button data-close-modal>Close</button></header><div class="dialog-body"><button class="create-choice" data-create="session"><span class="choice-icon">πx</span><span><strong>Arc session</strong><small>Choose a folder and start a new OMP session</small></span><kbd>⌘⇧N</kbd></button><button class="create-choice" data-create="terminal"><span class="choice-icon">&gt;_</span><span><strong>Terminal</strong><small>Choose a folder and open your login shell</small></span><kbd>⌘T</kbd></button></div>`,true);$$('[data-create]').forEach(b=>b.onclick=()=>createDemo(b.dataset.create))}
function createDemo(kind){const item={id:`${kind==='session'?'s':'t'}${Date.now()}`,title:kind==='session'?'New OMP session':'New terminal',cwd:'~/Developer/selected-project',path:kind==='session'?'main':'zsh',time:'now',live:true};(kind==='session'?sessions:terminals).unshift(item);$('#sessionCount').textContent=sessions.length;$('#terminalCount').textContent=terminals.length;closeModal();setMode(kind==='session'?'sessions':'terminals');activate(item.id)}

function renderModels(){const list=$('#modelList');if(!list)return;list.innerHTML=models.map((m,i)=>`<div class="model-card"><span class="model-logo">PK</span><span><strong>${m.name}</strong><small>${m.provider} · ${m.id}</small></span><button data-edit="${i}">Edit</button></div>`).join('');$$('[data-edit]').forEach(b=>b.onclick=renderModelForm)}
function renderModelForm(){ $('#modelForm').innerHTML=`<div class="form-grid"><label class="field"><span>Display name</span><input id="mName" value="Work Claude"></label><label class="field"><span>Provider name</span><input id="mProvider" value="Company Portkey"></label><label class="field full"><span>Protocol</span><select id="mProtocol"><option>OpenAI Chat Completions / Portkey</option><option>OpenAI Responses</option><option>Anthropic Messages</option></select></label><label class="field full"><span>Base URL</span><input value="https://api.portkey.ai/v1"></label><label class="field"><span>API key · macOS Keychain</span><input type="password" value="secret-key"></label><label class="field"><span>Model ID</span><input id="mId" value="@anthropic/claude"></label></div><button id="saveModel" class="save">Save model</button>`;$('#saveModel').onclick=()=>{models.push({name:$('#mName').value,provider:$('#mProvider').value,id:$('#mId').value,protocol:$('#mProtocol').value});$('#modelForm').innerHTML='';renderModels();showToast('Custom model saved')}}

function openPalette(){const p=$('#palette');p.classList.add('open');$('#paletteInput').value='';renderPalette();setTimeout(()=>$('#paletteInput').focus(),0)}
function closePalette(){ $('#palette').classList.remove('open') }
function renderPalette(){const q=$('#paletteInput').value.toLowerCase();const all=[...sessions,...terminals].filter(x=>!q||`${x.title} ${x.cwd}`.toLowerCase().includes(q));$('#paletteResults').innerHTML=all.map(x=>`<button class="palette-result" data-pick="${x.id}"><span>${x.title}<br><small style="margin:0">${x.cwd}</small></span><small>${x.time}</small></button>`).join('');$$('[data-pick]').forEach(b=>b.onclick=()=>{activate(b.dataset.pick);closePalette()})}
let toastTimer;function showToast(text){const t=$('#toast');t.textContent=text;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600)}
$('#sidebarToggle').onclick=toggleSidebar;$('#sideCreate').onclick=openCreate;$('#newBtn').onclick=openCreate;$('#settingsBtn').onclick=openSettings;$('#permissionsBtn').onclick=openPermissions;$('#filesBtn').onclick=()=>openWorkspace('files');$('#gitBtn').onclick=()=>openWorkspace('git');$('#panelClose').onclick=closeWorkspace;$('#refreshBtn').onclick=()=>showToast('Terminal restarted');$('#sideSearch').oninput=renderSidebar;$$('.side-tab').forEach(b=>b.onclick=()=>setMode(b.dataset.mode));$('#paletteInput').oninput=renderPalette;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closePalette();closeWorkspace();return}if(!e.metaKey)return;const k=e.key.toLowerCase();if(k==='b')toggleSidebar();if(k==='f'){e.preventDefault();$('#sideSearch').focus();$('#sideSearch').select()}if(k==='k'){e.preventDefault();openPalette()}if(k==='e')openWorkspace('files');if(k==='g')openWorkspace('git');if(k==='r')showToast('Terminal restarted');if(k==='n'){e.preventDefault();openCreate()}});window.addEventListener('message',()=>{});renderSidebar();
</script>
</body></html>
